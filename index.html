<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14080e">
  <title>Món quà nhỏ</title>
  <meta name="description" content="Một món quà nhỏ dành riêng cho bạn.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/bouquet-intro/wrap-back-v2.webp">
  <link rel="preload" as="image" href="assets/bouquet-intro/wrap-front-v2.webp">
  <link rel="preload" as="image" href="assets/bouquet-intro/rose-pink.webp">
  <link rel="preload" as="image" href="assets/bouquet-intro/bow.webp">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    @font-face {
      font-family: LetterDancing;
      src: url("assets/letter-20-10/DancingScript.ttf") format("truetype");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: LetterAllura;
      src: url("assets/letter-20-10/Allura.ttf") format("truetype");
      font-weight: 400; font-style: normal; font-display: swap;
    }

    :root {
      --ink: #14080e;
      --cream: #f6ebe0;
      --cherry: #9c2a45;
      --cherry-soft: #c45a6e;
      --gold: #d4b06a;
      --gold-dim: rgba(212, 176, 106, .55);
      --mist: rgba(246, 235, 224, .72);
      --ui-bg: rgba(28, 12, 18, .78);
      --font-display: "Fraunces", Georgia, serif;
      --font-hand: "Caveat", cursive;
      --font-ui: "Fraunces", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; width: 100%;
      background: var(--ink); color: var(--cream);
      font-family: var(--font-ui);
    }
    body {
      overflow: hidden; user-select: none; -webkit-user-select: none;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }

    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

    .stage {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-items: center;
      transition: opacity .8s ease, visibility .8s ease;
    }
    .stage.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ---------- màn chờ ---------- */
    .boot { text-align: center; padding: 28px 24px; max-width: 360px; }
    .gift {
      width: 76px; height: 70px; margin: 0 auto 24px; position: relative;
      animation: floaty 3s ease-in-out infinite;
    }
    .gift .box {
      position: absolute; left: 6px; right: 6px; bottom: 0; height: 42px; border-radius: 6px;
      background: linear-gradient(165deg, var(--cherry-soft), var(--cherry) 55%, #6a1830);
    }
    .gift .lid {
      position: absolute; left: 0; right: 0; top: 14px; height: 15px; border-radius: 5px;
      background: linear-gradient(180deg, #e8c98a, var(--gold));
    }
    .gift .rv {
      position: absolute; width: 9px; top: 14px; bottom: 0; left: 50%; margin-left: -4.5px;
      background: var(--cream);
    }
    .gift .rh {
      position: absolute; height: 7px; left: 6px; right: 6px; bottom: 17px;
      background: var(--cream);
    }
    .gift .bow {
      position: absolute; top: 0; left: 50%; width: 32px; height: 16px; margin-left: -16px;
      background:
        radial-gradient(circle at 28% 50%, var(--cream) 0 7px, transparent 8px),
        radial-gradient(circle at 72% 50%, var(--cream) 0 7px, transparent 8px);
    }
    .gift .spark { position: absolute; right: -10px; top: -8px; color: var(--gold); font-size: 15px; }
    .boot h1 {
      margin: 0 0 8px; font-family: var(--font-display); font-weight: 700;
      font-size: clamp(1.35rem, 4.5vw, 1.65rem); color: var(--cream);
    }
    .boot p { margin: 0; font-family: var(--font-hand); font-size: 1.2rem; color: var(--gold-dim); }

    /* ---------- bó hoa ---------- */
    .intro.bouquet-screen {
      position: fixed; inset: 0; z-index: 1000; isolation: isolate; overflow: hidden;
      --pull-progress: 0; --intro-fade-delay: 0.18s; --intro-fade-duration: 1.45s;
      user-select: none; touch-action: none;
    }
    .bouquet-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .8s, visibility .8s; }
    .bouquet-screen .bouquet-intro {
      box-sizing: border-box; position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      text-align: center;
      transition: opacity var(--intro-fade-duration) ease var(--intro-fade-delay);
    }
    .bouquet-screen .bouquet-stage {
      position: relative; isolation: isolate; flex: 0 0 auto;
      width: min(91vw, calc((100svh - 100px) / 1.28), 450px);
      aspect-ratio: 1000 / 1280; margin: 0;
    }
    .bouquet-screen[data-phase="ready"] .bouquet-stage { cursor: pointer; touch-action: none; }
    .bouquet-screen .bouquet-glow {
      position: absolute; z-index: -1; pointer-events: none;
      inset: -9% -35% -7%;
      background: radial-gradient(ellipse at 50% 42%, rgba(156,42,69,.22), rgba(212,176,106,.1) 32%, rgba(20,8,14,.05) 52%, transparent 70%);
      opacity: calc(.85 + var(--pull-progress) * .45);
      transform: scale(calc(1 + var(--pull-progress) * .05));
    }
    .bouquet-screen .bouquet-part {
      position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--h); z-index: var(--z);
      transform: rotate(var(--rotation, 0deg)) scaleX(var(--flip, 1));
      transform-origin: 50% 78%; opacity: 0;
      transition: opacity .85s ease;
      contain: layout style;
      will-change: opacity, transform, filter;
    }
    .bouquet-screen[data-phase="ready"] .bouquet-part,
    .bouquet-screen[data-phase="opening"] .bouquet-part { will-change: auto; }
    .bouquet-screen .bouquet-bloom {
      transition: opacity .75s cubic-bezier(.22,.75,.25,1), transform .85s cubic-bezier(.22,.75,.25,1), filter .75s ease;
    }
    .bouquet-screen .bouquet-art[data-kind="infill"] {
      transition: opacity .95s ease;
    }
    .bouquet-screen .bouquet-art { object-fit: contain; pointer-events: none; }
    .bouquet-screen .bouquet-photo {
      pointer-events: none;
      transform-origin: 50% 50%;
      opacity: 0;
      transform: translateY(16px) rotate(var(--rotation, 0deg)) scale(.55);
      filter: blur(8px) brightness(1.15);
      transition: opacity 1s cubic-bezier(.22,.75,.25,1), transform 1.05s cubic-bezier(.22,.75,.25,1), filter .9s ease;
    }
    .bouquet-screen .bouquet-photo.is-shown {
      opacity: 1;
      transform: rotate(var(--rotation, 0deg)) scale(1);
      filter: blur(0) brightness(1);
    }
    .bouquet-screen .bouquet-bloom.is-gone {
      opacity: 0;
      transform: rotate(calc(var(--rotation, 0deg) + 6deg)) scaleX(var(--flip, 1)) scale(.82);
      filter: blur(7px) brightness(1.3);
    }
    .bouquet-screen .bouquet-art[data-kind="infill"].is-shown { opacity: 1; }
    .bouquet-screen .bouquet-photo.is-card {
      display: flex; align-items: flex-start; justify-content: center;
      /* mép dưới mềm — chồng nhẹ cũng đỡ thô */
      -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
    }
    .bouquet-screen .bouquet-photo.is-card img {
      display: block; box-sizing: border-box;
      width: 100%; height: 78%;
      object-fit: cover; object-position: center top;
      border: 4px solid #fff0dd;
      border-bottom-width: 14px;
      border-radius: 3px;
      background: #f3d3d0;
      filter: drop-shadow(0 6px 12px rgba(80, 20, 40, .35));
    }
    .bouquet-screen .bouquet-art[data-kind="accent"] {
      filter: drop-shadow(0 8px 14px rgba(80, 20, 40, .28));
    }
    .bouquet-screen .bouquet-bow {
      --x: 26.5%; --y: 63.28%; --w: 47%; --h: 23%; --z: 50;
      padding: 0; border: 0; outline-offset: 5px; border-radius: 35%;
      background: transparent; transform-origin: 50% 20%;
      cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent;
      transform: translateY(calc(var(--pull-progress) * 36px)) rotate(var(--rotation, 0deg)) scaleX(var(--flip, 1));
      transition: filter .25s ease;
    }
    .bouquet-screen .bouquet-bow:disabled { cursor: default; }
    .bouquet-screen .bouquet-bow:not(:disabled) { filter: drop-shadow(0 4px 14px rgba(212, 176, 106, .35)); }
    .bouquet-screen.is-pulling .bouquet-bow { cursor: grabbing; transition: none; }
    .bouquet-screen .bouquet-bow img {
      width: 100%; height: 100%; object-fit: contain; pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(212, 176, 106, .25));
    }
    /* ruy băng kéo — thay vòng hold của bản gốc */
    .bouquet-screen .ribbon-pull {
      position: absolute; left: 46%; top: 78%; width: 8%; z-index: 55;
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none; opacity: 0; transition: opacity .35s ease;
      transform: translateY(calc(var(--pull-progress) * 36px));
    }
    .bouquet-screen[data-phase="ready"] .ribbon-pull,
    .bouquet-screen.is-pulling .ribbon-pull,
    .bouquet-screen[data-phase="opening"] .ribbon-pull { opacity: 1; }
    .bouquet-screen .ribbon-cord {
      width: 7px; height: calc(18px + var(--pull-progress) * 72px);
      border-radius: 4px;
      background: linear-gradient(180deg, var(--gold), var(--cherry));
      box-shadow: 0 4px 10px rgba(0,0,0,.35);
    }
    .bouquet-screen .ribbon-knob {
      margin-top: -2px; width: 22px; height: 22px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f0d9a0, var(--cherry));
      border: 1.5px solid rgba(246,235,224,.45);
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    .bouquet-screen .ribbon-hint-arrow {
      margin-top: 8px; font-size: 18px; font-weight: 600; letter-spacing: .02em;
      color: #ffe7b0;
      text-shadow: 0 2px 8px rgba(0,0,0,.75), 0 0 12px rgba(212,176,106,.55);
      opacity: calc(1 - var(--pull-progress) * .85);
      font-family: var(--font-hand); white-space: nowrap;
      animation: nudge-down 1.4s ease-in-out infinite;
    }
    .bouquet-screen.is-pulling .ribbon-hint-arrow { animation: none; opacity: 0; }
    @keyframes nudge-down {
      0%, 100% { transform: translateY(0); opacity: .85; }
      50% { transform: translateY(5px); opacity: 1; }
    }

    .bouquet-screen:not([data-phase="loading"]) .bouquet-art:not(.bouquet-bloom),
    .bouquet-screen:not([data-phase="loading"]) .bouquet-bow { opacity: 1; }
    .bouquet-screen:not([data-phase="loading"]) .bouquet-bloom:not(.is-gone) { opacity: 1; }
    .bouquet-screen:not([data-phase="ready"]):not([data-phase="opening"]):not([data-phase="revealing"]) .bouquet-art[data-kind="infill"] { opacity: 0; }
    .bouquet-screen[data-phase="ready"] .bouquet-photo:not(.is-shown),
    .bouquet-screen[data-phase="opening"] .bouquet-photo:not(.is-shown) {
      opacity: 1;
      transform: rotate(var(--rotation, 0deg)) scale(1);
      filter: none;
    }
    .bouquet-screen[data-phase="ready"] .bouquet-bloom:not(.is-gone),
    .bouquet-screen[data-phase="opening"] .bouquet-bloom { opacity: 0; }
    .bouquet-screen[data-phase="revealing"] { pointer-events: none; }

    .bouquet-screen .bouquet-reveal {
      position: absolute; inset: 0; z-index: 60; width: 100%; height: 100%;
      padding: 0; border: 0; border-radius: 35%; background: transparent;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .bouquet-screen .bouquet-reveal[hidden] { display: none; }
    .bouquet-screen .bouquet-footer { position: relative; z-index: 2; flex: 0 0 auto; margin-top: 12px; }
    .bouquet-screen .bouquet-hint {
      min-height: 1.7em; margin: 0; font-size: 18px; line-height: 1.5;
      letter-spacing: .01em; color: #ffe7b0;
      text-shadow: 0 2px 10px rgba(0,0,0,.65);
      font-family: var(--font-hand); font-weight: 600;
    }
    .bouquet-screen .bouquet-status {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }
    .bouquet-screen[data-phase="opening"] { pointer-events: none; }
    .bouquet-screen[data-phase="opening"] .bouquet-intro { opacity: 0; }

    .bouquet-screen .bouquet-art[data-kind="butterfly"] {
      animation: flap 2.8s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(255, 170, 200, .55));
    }
    .bouquet-screen .bouquet-art[data-kind="butterfly"].b2 { animation-delay: -1.3s; }

    @media (max-width: 600px) {
      .bouquet-screen .bouquet-stage { width: min(95vw, calc((100svh - 100px) / 1.28), 420px); }
      .bouquet-screen .bouquet-hint { font-size: 11px; }
    }

    /* ---------- HUD ---------- */
    #music {
      position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 6;
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
      background: rgba(20, 8, 16, .72); color: #fff; cursor: pointer; display: none; place-items: center;
    }
    body.is-open #music { display: grid; }
    #music[aria-pressed="false"] { opacity: .45; }
    #music svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    #openMail {
      position: fixed; top: max(14px, env(safe-area-inset-top)); right: 70px; z-index: 6;
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,200,220,.35);
      background: rgba(20, 8, 16, .72); cursor: pointer; display: none; place-items: center;
      opacity: 0; transform: scale(.6); transition: opacity .6s, transform .6s cubic-bezier(.2,.8,.2,1.3);
      filter: drop-shadow(0 0 6px rgba(255, 170, 200, .75));
    }
    body.is-open #openMail { display: grid; }
    body.is-mail-ready #openMail { opacity: 1; transform: none; animation: pulse 2.2s ease-in-out 1s infinite; }
    #openMail .env-ico { width: 26px; height: 18px; position: relative; background: #f0c4c8; border-radius: 3px; overflow: hidden; }
    #openMail .env-ico::before {
      content: ""; position: absolute; left: 3px; right: 3px; top: -9px; height: 18px; background: #d4929a;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    #openMail .dot { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold-dim); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px transparent; } 0% { box-shadow: 0 0 0 0 rgba(212,176,106,.45); } }

    /* ---------- hộp thư (tông hồng mẫu) ---------- */
    #mail {
      position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
      background: rgba(12, 6, 16, .92);
      opacity: 0; visibility: hidden; transition: opacity .5s, visibility .5s;
    }
    #mail.is-show { opacity: 1; visibility: visible; }
    #closeMail {
      position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(246, 206, 206, .27); background: rgba(37, 22, 39, .79); color: #f2d4cf; font: 28px/1 sans-serif; cursor: pointer; z-index: 9;
    }
    .env-scene {
      position: relative; perspective: 1400px; width: min(86vw, 340px);
      display: grid; justify-items: center; gap: 14px;
      transition: transform .8s cubic-bezier(.2,.7,.2,1) .3s;
      --pink-texture: url("assets/letter-20-10/pink-texture.webp");
      --paper-texture: url("assets/letter-20-10/paper-texture.webp");
    }
    .env-scene.is-open { transform: translateY(min(38%, 14vh)); }
    #envelope {
      position: relative; width: 100%; aspect-ratio: 34 / 22; cursor: pointer;
      transform-style: preserve-3d; outline: none; -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 24px 40px rgba(0,0,0,.55));
    }
    .env-back {
      position: absolute; inset: 0; border-radius: 6px;
      background: var(--pink-texture) 0 0 / 204px 154px; border: 1px solid #dab7b1;
    }
    .env-front {
      position: absolute; inset: 0; border-radius: 6px; z-index: 3;
      background: linear-gradient(160deg, #f8e4e6, #e8c0c4);
      clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
    }
    .env-front::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(200deg, rgba(255,255,255,.35), transparent 40%);
      clip-path: polygon(0 0, 50% 52%, 0 100%);
    }
    .env-flap {
      position: absolute; left: 0; right: 0; top: 0; height: 56%; z-index: 4;
      transform-origin: top; transform-style: preserve-3d;
      background: linear-gradient(#f4d8dc, #e0b0b8);
      clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 6px 6px 0 0;
      transition: transform .7s cubic-bezier(.4,0,.2,1), z-index 0s .35s;
    }
    .env-flap::after {
      content: ""; position: absolute; inset: 0;
      background: var(--pink-texture) 0 0 / 204px 154px; filter: brightness(.95);
      transform: rotateX(180deg); backface-visibility: hidden;
    }
    .env-scene.is-open .env-flap { transform: rotateX(-180deg); z-index: 1; }
    .seal {
      position: absolute; left: 50%; top: 56%; width: 17%; aspect-ratio: 1;
      margin-left: -8.5%; margin-top: -8.5%; z-index: 5; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e8889a, #8a3048 70%);
      color: #ffe8ee; display: grid; place-items: center;
      font: 600 1.2rem LetterAllura, LetterDancing, cursive;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.18), 0 3px 8px rgba(0,0,0,.4);
      transition: opacity .3s, transform .3s;
    }
    .env-scene.is-open .seal { opacity: 0; transform: scale(.6); }
    .env-words {
      position: absolute; left: 0; right: 0; top: 7%; z-index: 5; text-align: center;
      color: #814f3d; pointer-events: none; font-family: Georgia, serif; line-height: 1.1;
      transition: opacity .3s;
    }
    .env-words small { display: block; font-size: .85rem; letter-spacing: .1em; opacity: .9; }
    .env-words b {
      display: block; font-size: 1.9rem; font-weight: 400; letter-spacing: .02em;
      font-family: LetterAllura, "Dancing Script", cursive; color: #a85c47;
    }
    .env-scene.is-open .env-words { opacity: 0; }
    .flora { position: absolute; z-index: 6; width: 30%; pointer-events: none; }
    .flora.l { left: 0; bottom: 0; }
    .flora.r { right: 0; top: 0; transform: scaleX(-1) rotate(180deg); }
    .env-scene.is-open .flora { z-index: 3; }
    .env-hint { margin: 0; font-size: .85rem; color: rgba(240, 199, 200, .9); transition: opacity .3s; }
    .env-scene.is-open .env-hint { opacity: 0; }

    #paper {
      position: absolute; left: 5%; width: 90%; top: 3%; aspect-ratio: 3 / 4.3; z-index: 2;
      background: var(--paper-texture) 0 0 / 204px 154px; border-radius: 4px;
      border: 1px solid #e8d6cc; box-shadow: 0 10px 30px rgba(0,0,0,.35);
      transform: translateY(18%) scale(.9); opacity: 0; overflow: hidden; cursor: default;
      transition: transform .8s cubic-bezier(.2,.7,.2,1) .35s, opacity .5s .35s, z-index 0s .6s;
    }
    .env-scene.is-open #paper { transform: translateY(-50%) scale(1.08); opacity: 1; z-index: 4; }
    #paper .corner { position: absolute; width: 30%; pointer-events: none; opacity: .95; }
    #paper .corner.tl { left: -3%; top: -3%; }
    #paper .corner.br { right: -2%; bottom: -2%; width: 36%; transform: rotate(180deg); }
    #paper .corner.mr { right: -6%; top: 62%; width: 22%; transform: rotate(-30deg); }
    #paper article {
      position: absolute; inset: 8% 8% 7% 8%; color: #704a40;
      font-family: LetterDancing, "Dancing Script", cursive;
      overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; touch-action: pan-y;
      scrollbar-width: none;
    }
    #paper article::-webkit-scrollbar { display: none; }
    #paper h1 {
      margin: 0 0 .45rem; padding-left: 15%; font-family: LetterAllura, "Dancing Script", cursive;
      font-size: clamp(1.05rem, 4.4vw, 1.4rem); font-weight: 400; color: #a55e4d; line-height: 1.2;
    }
    #paper p { margin: 0; font-size: clamp(.82rem, 3.3vw, .98rem); line-height: 1.4; white-space: pre-line; }
    /* ảnh nhỏ góc phải — chữ chạy quanh, không che chữ */
    #paper .snap {
      float: right; shape-outside: margin-box; margin: .1rem 0 .35rem .6rem; width: 30%;
      border: 0; padding: 3px 3px 10px; background: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,.25); transform: rotate(5deg); cursor: zoom-in;
      transition: transform .45s cubic-bezier(.2,.8,.2,1); position: relative; transform-origin: center;
    }
    #paper .snap img { width: 100%; aspect-ratio: 3 / 3.4; object-fit: cover; display: block; }

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { CONFIG } from "./config.js";

    /* Layout mẫu — toạ độ trên canvas 1000×1280 */
    const CW = 1000, CH = 1280;
    const pct = (v, total) => `${(v / total) * 100}%`;
    const stylePart = (p) => ({
      "--x": pct(p.x, CW), "--y": pct(p.y, CH),
      "--w": pct(p.width, CW), "--h": pct(p.height, CH),
      "--rotation": `${p.rotate || 0}deg`,
      "--flip": p.flip ? -1 : 1,
      "--z": String(p.z ?? 10)
    });

    const ART = [
      { asset: "wrap-back-v2", x: 82, y: 125, width: 836, height: 1115, rotate: 0, z: 5, kind: "back" },
      { asset: "leaf-sprig", x: 48, y: 258, width: 310, height: 490, rotate: -26, z: 7, kind: "foliage" },

      { asset: "baby-breath", x: 658, y: 229, width: 246, height: 465, rotate: 15, z: 8, kind: "foliage", flip: true },
      { asset: "baby-breath", x: 330, y: 250, width: 175, height: 345, rotate: -10, z: 9, kind: "infill", revealDelay: 750 },
      { asset: "baby-breath", x: 523, y: 246, width: 202, height: 357, rotate: 15, z: 9, kind: "infill", revealDelay: 950, flip: true },
      { asset: "baby-breath", x: 435, y: 548, width: 210, height: 310, rotate: -5, z: 9, kind: "infill", revealDelay: 1350 },
      { asset: "rose-pink", x: 327, y: 429, width: 125, height: 140, rotate: -8, z: 10, kind: "infill", revealDelay: 900 },
      { asset: "rose-pink", x: 558, y: 463, width: 116, height: 128, rotate: 16, z: 10, kind: "infill", revealDelay: 1100, flip: true },
      { asset: "rose-ivory", x: 450, y: 400, width: 110, height: 120, rotate: 8, z: 10, kind: "infill", revealDelay: 1000 },
      { asset: "rose-pink", x: 145, y: 555, width: 236, height: 247, rotate: -17, z: 30, kind: "flower" },
      { asset: "rose-pink", x: 619, y: 548, width: 230, height: 241, rotate: 22, z: 30, kind: "flower" },
      { asset: "baby-breath", x: 155, y: 570, width: 180, height: 260, rotate: -15, z: 31, kind: "flower" },
      { asset: "rose-pink", x: 259, y: 661, width: 205, height: 220, rotate: -9, z: 32, kind: "flower" },
      { asset: "rose-ivory", x: 576, y: 664, width: 196, height: 202, rotate: 13, z: 32, kind: "flower" },
      { asset: "baby-breath", x: 432, y: 683, width: 136, height: 198, rotate: 4, z: 43, kind: "flower" },
      { asset: "rose-pink", x: 400, y: 620, width: 150, height: 160, rotate: -6, z: 33, kind: "flower" },
      { asset: "wrap-front-v2", x: 60, y: 525, width: 880, height: 550, rotate: 0, z: 40, kind: "front" },
      { asset: "butterfly", x: 70, y: 150, width: 80, height: 75, rotate: -17, z: 48, kind: "butterfly" },
      { asset: "butterfly", x: 861, y: 257, width: 77, height: 72, rotate: 16, z: 48, kind: "butterfly", flip: true }
    ];

    /* 6 ô theo mẫu — giữa = 6.png, quanh = 1–5 */
    const SLOTS = [
      { x: 378, y: 320, width: 244, height: 330, rotate: -1, z: 26 },
      { x: 176, y: 160, width: 230, height: 310, rotate: -6, z: 14 },
      { x: 594, y: 160, width: 230, height: 310, rotate: 6, z: 15 },
      { x: 378, y: 108, width: 244, height: 310, rotate: 0, z: 12 },
      { x: 139, y: 400, width: 230, height: 310, rotate: -8, z: 20 },
      { x: 631, y: 400, width: 230, height: 310, rotate: 8, z: 20 }
    ];
    const BLOOMS = [
      { asset: "rose-pink", x: 296, y: 300, width: 340, height: 340, rotate: -3, z: 27 },
      { asset: "rose-ivory", x: 144, y: 190, width: 300, height: 300, rotate: -14, z: 15 },
      { asset: "rose-pink", x: 560, y: 180, width: 300, height: 300, rotate: 12, z: 16, flip: true },
      { asset: "rose-pink", x: 294, y: 115, width: 310, height: 310, rotate: -4, z: 13 },
      { asset: "rose-pink", x: 107, y: 415, width: 300, height: 300, rotate: -13, z: 21 },
      { asset: "rose-ivory", x: 591, y: 415, width: 300, height: 300, rotate: 13, z: 21 }
    ];
    /* hoa trang trí mép ảnh — giữ sau khi hé */
    const CENTER_ACCENTS = [
      { asset: "rose-pink", x: 305, y: 430, width: 140, height: 140, rotate: -16, z: 28, kind: "accent" },
      { asset: "rose-ivory", x: 535, y: 425, width: 135, height: 135, rotate: 14, z: 28, kind: "accent" },
      { asset: "baby-breath", x: 340, y: 280, width: 140, height: 175, rotate: -10, z: 25, kind: "accent" },
      { asset: "baby-breath", x: 510, y: 275, width: 140, height: 175, rotate: 12, z: 25, kind: "accent", flip: true },
      { asset: "rose-ivory", x: 430, y: 480, width: 115, height: 115, rotate: 4, z: 29, kind: "accent" }
    ];
    /* delay hé từng ảnh — chậm, lần lượt rõ từng tấm */
    const REVEAL_DELAYS = [200, 750, 1300, 1850, 2400, 2950];

    const $ = (s, r = document) => r.querySelector(s);
    const body = document.body;
    const boot = $("#boot"), garden = $("#garden"), letter = $("#letter");
    const stage = $("#bouquetStage");
    const hint = $("#bouquet-hint");
    const status = $(".bouquet-status");
    const revealBtn = $(".bouquet-reveal");
    const bowBtn = $(".bouquet-bow");

    /* ---------- nền sao (nhẹ — tắt khi vào màn 3D) ---------- */
    const sky = $("#sky"), sctx = sky.getContext("2d", { alpha: false });
    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + .35,
      p: Math.random() * 6.28, s: .6 + Math.random() * 1.4, glow: Math.random() < .1
    }));
    let skyDpr = 1, skyRunning = true, skyRaf = 0, skyWash = null;
    function resizeSky() {
      skyDpr = Math.min(devicePixelRatio || 1, 1.5);
      sky.width = Math.floor(innerWidth * skyDpr);
      sky.height = Math.floor(innerHeight * skyDpr);
      skyWash = null;
    }
    function ensureSkyWash(w, h) {
      if (skyWash && skyWash.w === w && skyWash.h === h) return skyWash;
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d");
      x.fillStyle = "#000"; x.fillRect(0, 0, w, h);
      const g = x.createRadialGradient(w / 2, h * .42, 0, w / 2, h * .42, Math.max(w, h) * .55);
      g.addColorStop(0, "rgba(80, 28, 52, .45)"); g.addColorStop(1, "rgba(0,0,0,0)");
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      skyWash = { w, h, c };
      return skyWash;
    }
    function drawSky(t) {
      if (!skyRunning) return;
      const w = sky.width, h = sky.height;
      sctx.drawImage(ensureSkyWash(w, h).c, 0, 0);
      for (const s of stars) {
        const a = .35 + .4 * Math.sin(t * .0012 * s.s + s.p);
        const x = s.x * w, y = s.y * h;
        if (s.glow) {
          sctx.fillStyle = `rgba(255,210,230,${a * .22})`;
          sctx.beginPath(); sctx.arc(x, y, 10 * skyDpr, 0, 6.28); sctx.fill();
        }
        sctx.fillStyle = `rgba(255,236,245,${a})`;
        sctx.beginPath(); sctx.arc(x, y, s.r * skyDpr, 0, 6.28); sctx.fill();
      }
      skyRaf = requestAnimationFrame(drawSky);
    }
    function stopSky() {
      skyRunning = false;
      cancelAnimationFrame(skyRaf);
      sky.style.display = "none";
    }
    resizeSky();
    addEventListener("resize", () => { if (skyRunning) resizeSky(); }, { passive: true });
    skyRaf = requestAnimationFrame(drawSky);

    /* ---------- ảnh ---------- */
    function placeholder(i, w = 300, h = 380) {
      const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
      const pal = [["#f8d0dc", "#8a3048"], ["#ffe8f0", "#c44a6a"], ["#f0c8d4", "#6e2840"], ["#fde4ec", "#a03858"], ["#f6c8d8", "#7a3048"]][i % 5];
      const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.fillStyle = "rgba(255,255,255,.85)"; x.font = "600 120px Fraunces, serif"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText("♥", w / 2, h / 2 - 10);
      x.font = "500 22px Fraunces, serif"; x.fillText(`ảnh ${i + 1}`, w / 2, h - 36);
      return c.toDataURL("image/jpeg", .9);
    }
    function probe(url) {
      return new Promise((res) => {
        const im = new Image();
        im.decoding = "async";
        im.onload = () => res(url);
        im.onerror = () => res(null);
        im.src = url;
      });
    }

    let photos = [];
    let scenePhotos = [];
    let bloomed = false, opened = false;
    let sceneBuilt = false, scenePaused = false;

    function applyStyle(el, vars) {
      for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
    }

    function buildBouquet() {
      const frag = document.createDocumentFragment();
      let butterflyN = 0;
      for (const p of ART) {
        const img = document.createElement("img");
        img.className = "bouquet-part bouquet-art";
        if (p.kind === "butterfly") {
          butterflyN += 1;
          if (butterflyN === 2) img.classList.add("b2");
        }
        img.dataset.kind = p.kind;
        if (p.revealDelay) img.dataset.revealDelay = String(p.revealDelay);
        img.src = `assets/bouquet-intro/${p.asset}.webp`;
        img.alt = ""; img.draggable = false; img.decoding = "async"; img.loading = "eager";
        img.setAttribute("aria-hidden", "true");
        applyStyle(img, stylePart(p));
        frag.appendChild(img);
      }
      const order = CONFIG.photoOrder || SLOTS.map((_, i) => i);
      for (let i = 0; i < SLOTS.length; i++) {
        const slot = SLOTS[i];
        const photoIdx = order[i] % photos.length;
        const wrap = document.createElement("div");
        wrap.className = "bouquet-part bouquet-photo is-card";
        wrap.dataset.kind = "portrait";
        wrap.dataset.photoIndex = String(photoIdx);
        wrap.setAttribute("aria-hidden", "true");
        applyStyle(wrap, stylePart(slot));
        const im = document.createElement("img");
        im.src = photos[photoIdx];
        im.alt = `Ảnh ${photoIdx + 1} trong bó hoa`;
        im.draggable = false; im.decoding = "async"; im.loading = "eager";
        wrap.appendChild(im);
        frag.appendChild(wrap);
      }
      /* hoa giữa — không biến mất khi hé ảnh */
      CENTER_ACCENTS.forEach((p) => {
        const img = document.createElement("img");
        img.className = "bouquet-part bouquet-art";
        img.dataset.kind = p.kind || "accent";
        img.src = `assets/bouquet-intro/${p.asset}.webp`;
        img.alt = ""; img.draggable = false; img.decoding = "async"; img.loading = "eager";
        img.setAttribute("aria-hidden", "true");
        applyStyle(img, stylePart(p));
        frag.appendChild(img);
      });
      BLOOMS.forEach((b) => {
        const img = document.createElement("img");
        img.className = "bouquet-part bouquet-art bouquet-bloom";
        img.dataset.kind = "bloom";
        img.dataset.keep = "false";
        img.src = `assets/bouquet-intro/${b.asset}.webp`;
        img.alt = ""; img.draggable = false; img.decoding = "async"; img.loading = "eager";
        img.setAttribute("aria-hidden", "true");
        applyStyle(img, stylePart(b));
        frag.appendChild(img);
      });
      const bow = bowBtn;
      const reveal = revealBtn;
      stage.insertBefore(frag, bow);
      // ensure bow & reveal stay last for hit targets
      stage.appendChild(bow);
      stage.appendChild(reveal);
    }

    const IMG_EXT = /\.(png|jpe?g|webp)$/i;

    /** danh sách ảnh đã ghi sẵn — cần cho GitHub Pages / host tĩnh (không có directory listing) */
    async function listFromManifest(dir) {
      const base = dir.replace(/\/$/, "");
      try {
        const res = await fetch(`${base}/manifest.json`, { cache: "no-store" });
        if (!res.ok) return [];
        const data = await res.json();
        const names = Array.isArray(data) ? data
          : Array.isArray(data?.files) ? data.files
          : [];
        return names
          .map((n) => String(n || "").trim())
          .filter((n) => n && IMG_EXT.test(n) && !/huong-dan|manifest/i.test(n))
          .map((n) => `${base}/${n.replace(/^\.\//, "")}`);
      } catch {
        return [];
      }
    }

    /** đọc mọi ảnh trong folder (tên tự do) qua directory listing của http.server — chỉ chạy local */
    async function listFolderImages(dir) {
      const base = dir.replace(/\/$/, "");
      try {
        const res = await fetch(`${base}/`);
        if (!res.ok) return [];
        const html = await res.text();
        /* GitHub Pages trả index.html của app, không phải listing */
        if (!/<a\s[^>]*href=/i.test(html) || /<script\s/i.test(html.slice(0, 800))) return [];
        const names = new Set();
        for (const m of html.matchAll(/href="([^"]+)"/gi)) {
          let href = m[1].split("?")[0];
          try { href = decodeURIComponent(href); } catch { /* keep */ }
          const name = href.split("/").pop();
          if (!name || name.startsWith(".") || /huong-dan|manifest/i.test(name)) continue;
          if (IMG_EXT.test(name)) names.add(name);
        }
        return [...names].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
          .map((n) => `${base}/${n}`);
      } catch {
        return [];
      }
    }

    async function loadScenePhotos() {
      const dir = (CONFIG.scenePhotosDir || "assets/photos-3d").replace(/\/$/, "");
      /* 1) manifest.json (host tĩnh) → 2) directory listing (local) → 3) 1.png…N */
      let listed = await listFromManifest(dir);
      if (!listed.length) listed = await listFolderImages(dir);
      if (listed.length) {
        const ok = await Promise.all(listed.map(probe));
        return ok.filter(Boolean);
      }
      const max = CONFIG.scenePhotoMax || 24;
      const exts = ["png", "webp", "jpg", "jpeg"];
      const slots = await Promise.all(Array.from({ length: max }, async (_, i) => {
        const n = i + 1;
        for (const ext of exts) {
          const url = await probe(`${dir}/${n}.${ext}`);
          if (url) return url;
        }
        return null;
      }));
      return slots.filter(Boolean);
    }

    async function loadLetterPhoto() {
      const configured = CONFIG.letter?.photo;
      if (typeof configured === "string") {
        const hit = await probe(configured);
        if (hit) return hit;
      }
      for (const name of ["photo.png", "photo.jpg", "photo.jpeg", "photo.webp", "1.png", "1.jpg"]) {
        const hit = await probe(`assets/letter/${name}`);
        if (hit) return hit;
      }
      if (typeof configured === "number" && photos.length) {
        return photos[configured % photos.length];
      }
      return photos[0] || null;
    }

    const uniqueArt = [...new Set(
      ART.map((a) => a.asset)
        .concat(BLOOMS.map((b) => b.asset))
        .concat(CENTER_ACCENTS.map((a) => a.asset))
        .concat(["bow"])
    )];

    const photosReady = Promise.all(CONFIG.photos.map(probe)).then((list) => {
      const real = list.filter(Boolean);
      photos = real.length ? real : CONFIG.photos.map((_, i) => placeholder(i));
      buildBouquet();
    });

    const scenePhotosReady = loadScenePhotos().then((list) => {
      scenePhotos = list.length ? list : null;
    });

    const artsReady = Promise.all(uniqueArt.map((name) => probe(`assets/bouquet-intro/${name}.webp`)));

    function setPhase(phase) {
      garden.dataset.phase = phase;
    }
    function setPull(p) {
      garden.style.setProperty("--pull-progress", String(Math.max(0, Math.min(1, p))));
    }
    function setHint(text) {
      hint.textContent = text;
      status.textContent = text;
    }

    function showGarden() {
      boot.classList.add("is-hidden");
      garden.classList.remove("is-hidden");
      setPhase("flowers");
      setHint(CONFIG.hintTap);
    }

    Promise.all([photosReady, artsReady]).then(() => setTimeout(showGarden, 280));

    function bloom() {
      if (bloomed || opened) return;
      bloomed = true;
      /* iPhone: lần chạm đầu phải nằm trong gesture → mở khóa audio */
      unlockMusic();
      setPhase("revealing");
      revealBtn.hidden = true;
      revealBtn.disabled = true;
      setHint("Đang hé lộ ảnh trong bó hoa…");

      const photoEls = [...stage.querySelectorAll(".bouquet-photo")];
      const bloomEls = [...stage.querySelectorAll(".bouquet-bloom")];
      const infills = [...stage.querySelectorAll('[data-kind="infill"]')];

      /* từng ảnh một: hoa phủ biến mất → ảnh hiện */
      const settle = (el, cls, final = {}) => {
        if (!el) return;
        el.style.transition = "none";
        el.getAnimations?.().forEach((a) => a.cancel());
        el.classList.add(cls);
        if (final.opacity != null) el.style.opacity = final.opacity;
        if (final.transform != null) el.style.transform = final.transform;
        if (final.filter != null) el.style.filter = final.filter;
        void el.offsetWidth;
      };
      photoEls.forEach((photo, i) => {
        const delay = REVEAL_DELAYS[i] ?? i * 380;
        const rot = SLOTS[i]?.rotate || 0;
        setTimeout(() => {
          if (opened) return;
          const bloom = bloomEls[i];
          const bRot = BLOOMS[i]?.rotate || 0;
          const flip = BLOOMS[i]?.flip ? -1 : 1;
          settle(bloom, "is-gone", {
            opacity: "0",
            transform: `rotate(${bRot + 6}deg) scaleX(${flip}) scale(.82)`,
            filter: "blur(7px) brightness(1.3)"
          });
          settle(photo, "is-shown", {
            opacity: "1",
            transform: `rotate(${rot}deg) scale(1)`,
            filter: "blur(0) brightness(1)"
          });
        }, delay);
      });
      infills.forEach((el) => {
        const d = Number(el.dataset.revealDelay) || 750;
        setTimeout(() => {
          if (!opened) settle(el, "is-shown", { opacity: "1" });
        }, d);
      });

      const totalMs = Math.max(...REVEAL_DELAYS) + 1400;
      setTimeout(() => {
        if (opened) return;
        setPhase("ready");
        bowBtn.disabled = false;
        setHint(CONFIG.hintPull);
      }, totalMs);
    }

    /* kéo ruy băng xuống (không ấn giữ như bản gốc) */
    let pullActive = false, pullStartY = 0, pullProgress = 0;
    const pullNeed = () => CONFIG.pullPx || 130;

    function endPull(commit) {
      if (!pullActive && !garden.classList.contains("is-pulling")) return;
      pullActive = false;
      garden.classList.remove("is-pulling");
      if (opened) return;
      if (commit && pullProgress >= .9) {
        setPull(1);
        openLetter();
        return;
      }
      /* thả giữa chừng → kéo lại */
      const from = pullProgress;
      const t0 = performance.now();
      const spring = (now) => {
        if (opened || pullActive) return;
        const t = Math.min(1, (now - t0) / 280);
        const ease = 1 - Math.pow(1 - t, 3);
        setPull(from * (1 - ease));
        pullProgress = from * (1 - ease);
        if (t < 1) requestAnimationFrame(spring);
      };
      requestAnimationFrame(spring);
    }

    revealBtn.addEventListener("click", (e) => { e.preventDefault(); bloom(); });
    bowBtn.addEventListener("pointerdown", (e) => {
      if (!bloomed || opened || bowBtn.disabled) return;
      unlockMusic();
      pullActive = true;
      pullStartY = e.clientY;
      pullProgress = 0;
      garden.classList.add("is-pulling");
      try { bowBtn.setPointerCapture(e.pointerId); } catch { /* pointer đã mất */ }
    });
    bowBtn.addEventListener("pointermove", (e) => {
      if (!pullActive || opened) return;
      const dy = Math.max(0, e.clientY - pullStartY);
      pullProgress = Math.min(1, dy / pullNeed());
      setPull(pullProgress);
      if (pullProgress >= .98) endPull(true);
    });
    bowBtn.addEventListener("pointerup", () => endPull(true));
    bowBtn.addEventListener("pointercancel", () => endPull(false));
    bowBtn.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      if (bloomed && !opened) openLetter();
    });

    function openLetter() {
      if (opened) return;
      opened = true;
      pullActive = false;
      garden.classList.remove("is-pulling");
      setPull(1);
      setPhase("opening");
      body.classList.add("is-open");
      setHint("Đang mở thiệp.");
      startMusic();
      stopSky();
      buildScene().then(() => {
        letter.classList.remove("is-hidden");
        setTimeout(() => {
          garden.classList.add("is-hidden");
          /* giải phóng DOM bó hoa sau khi fade — nhẹ RAM */
          setTimeout(() => { if (garden.parentNode) garden.remove(); }, 900);
        }, 1500);
      });
    }

    /* ---------- cảnh 3D — mưa ảnh / chữ / tim rơi (theo bản gốc) ---------- */
    let renderer, scene, camera, controls, starGroup, starUniforms, sceneClock;
    const rain = [];
    const Y_TOP = 95, Y_BOT = -55, FADE_IN_BELOW = 55, FADE_OUT_ABOVE = -35;
    const IS_MOBILE = matchMedia("(max-width: 700px), (pointer: coarse)").matches;
    /* quầng sáng nướng sẵn vào texture thay cho bloom post-process → nhẹ cho Safari, không artefact */
    const Q = IS_MOBILE
      ? { cols: 14, rows: 7, stars: 900, imgMax: 640, dprMax: 1.75 }
      : { cols: 18, rows: 9, stars: 1500, imgMax: 1024, dprMax: 2 };
    const PINK = "#EE66A6";
    const HEART_RED = 0xe62e00;
    /* chuyển sắc hồng ↔ xanh nhạt (bảng "hong" của bản gốc), chu kỳ 2.5s */
    const COLOR_A = new THREE.Color(PINK), COLOR_B = new THREE.Color("#99DDFF");
    const COLOR_PERIOD = 2.5;
    const cycleColor = new THREE.Color(), tmpColor = new THREE.Color();

    const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
    const smooth = (t) => { const o = clamp01(t); return o * o * (3 - 2 * o); };
    const fadeByY = (y) => smooth(
      clamp01((y - Y_BOT) / (FADE_OUT_ABOVE - Y_BOT)) *
      clamp01((Y_TOP - y) / (Y_TOP - FADE_IN_BELOW))
    );
    const randY = () => Y_BOT + Math.random() * (Y_TOP - Y_BOT);

    function roundRectPath(ctx, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.quadraticCurveTo(w, 0, w, r);
      ctx.lineTo(w, h - r); ctx.quadraticCurveTo(w, h, w - r, h);
      ctx.lineTo(r, h); ctx.quadraticCurveTo(0, h, 0, h - r);
      ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
    }

    function loadRainTexture(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => {
          let w = img.width, h = img.height;
          const max = Q.imgMax;
          if (w > max || h > max) {
            if (w > h) { h = Math.floor(h / w * max); w = max; }
            else { w = Math.floor(w / h * max); h = max; }
          }
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const ctx = c.getContext("2d");
          roundRectPath(ctx, w, h, w * .05);
          ctx.clip();
          ctx.drawImage(img, 0, 0, w, h);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.generateMipmaps = true;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 1;
          resolve(tex);
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    /* glow hồng phía sau ảnh */
    let glowTex = null;
    function getGlowTexture() {
      if (glowTex) return glowTex;
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const x = c.getContext("2d");
      const g = x.createRadialGradient(64, 64, 8, 64, 64, 64);
      g.addColorStop(0, "rgba(255,255,255,.9)");
      g.addColorStop(.45, "rgba(255,255,255,.28)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      x.fillStyle = g; x.fillRect(0, 0, 128, 128);
      glowTex = new THREE.CanvasTexture(c);
      glowTex.colorSpace = THREE.SRGBColorSpace;
      return glowTex;
    }

    /* chữ — wrap 8 từ / dòng như bản gốc, font Mali; vẽ trắng + quầng trắng rồi tint bằng material.color */
    const textCache = new Map();
    function wrapWords(text, perLine = 8) {
      const parts = text.split(/(\s+)/);
      let n = 0, out = "";
      for (const p of parts) {
        if (p.trim().length) n++;
        out += p;
        if (n >= perLine && /\s+/.test(p)) { out = out.trimEnd() + "\n"; n = 0; }
      }
      return out.trim();
    }
    function textMesh(text) {
      let data = textCache.get(text);
      if (!data) {
        const px = 72, lineH = px * 1.2, pad = px * .7;
        const lines = wrapWords(text).split("\n");
        const c = document.createElement("canvas"), x = c.getContext("2d");
        const font = `700 ${px}px Mali, sans-serif`;
        x.font = font;
        const w = Math.ceil(Math.max(...lines.map((l) => x.measureText(l).width))) + pad * 2;
        const h = Math.ceil(lines.length * lineH + pad * 1.4);
        c.width = w; c.height = h;
        x.font = font; x.textBaseline = "middle"; x.textAlign = "center";
        x.fillStyle = "#fff";
        /* lớp 1: quầng rộng mờ, lớp 2: quầng sát, lớp 3: nét chữ */
        x.shadowColor = "rgba(255,255,255,.55)"; x.shadowBlur = px * .45;
        lines.forEach((l, i) => x.fillText(l, w / 2, pad * .7 + lineH * (i + .5)));
        x.shadowColor = "rgba(255,255,255,.9)"; x.shadowBlur = px * .18;
        lines.forEach((l, i) => x.fillText(l, w / 2, pad * .7 + lineH * (i + .5)));
        x.shadowBlur = 0; x.shadowColor = "transparent";
        lines.forEach((l, i) => x.fillText(l, w / 2, pad * .7 + lineH * (i + .5)));
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.generateMipmaps = false; /* mipmap làm hiện ô mờ quanh chữ khi ở xa */
        tex.minFilter = THREE.LinearFilter;
        const k = 1.5 / lineH; /* fontSize 1.5 đơn vị như bản gốc */
        data = { geo: new THREE.PlaneGeometry(w * k, h * k), tex };
        textCache.set(text, data);
      }
      const mat = new THREE.MeshBasicMaterial({
        map: data.tex, color: COLOR_A, transparent: true, opacity: 0, depthWrite: false,
        side: THREE.DoubleSide, toneMapped: false
      });
      return new THREE.Mesh(data.geo, mat);
    }

    function heartGeometry() {
      const s = new THREE.Shape();
      s.moveTo(25, 25); s.bezierCurveTo(25, 25, 20, 0, 0, 0); s.bezierCurveTo(-30, 0, -30, 35, -30, 35);
      s.bezierCurveTo(-30, 55, -10, 77, 25, 95); s.bezierCurveTo(60, 77, 80, 55, 80, 35);
      s.bezierCurveTo(80, 35, 80, 0, 50, 0); s.bezierCurveTo(35, 0, 25, 25, 25, 25);
      const g = new THREE.ExtrudeGeometry(s, {
        depth: 14, bevelEnabled: true, bevelThickness: 8, bevelSize: 8,
        bevelSegments: 3, curveSegments: 8
      });
      g.center(); g.rotateZ(Math.PI); g.scale(.02, .02, .02);
      return g;
    }

    /* sao vàng lấp lánh bao quanh camera — shader port từ bản gốc */
    const STAR_VS = `
      attribute float aSize; attribute float aPhase; attribute float aSpeed; attribute vec3 aColor;
      uniform float uTime; uniform float uPixelRatio;
      varying vec3 vColor; varying float vTwinkle; varying float vSize;
      void main() {
        vColor = aColor;
        float w = 0.5 + 0.5 * sin(uTime * aSpeed + aPhase);
        float w2 = 0.5 + 0.5 * sin(uTime * aSpeed * 1.7 + aPhase * 2.3);
        vTwinkle = 0.45 + 0.75 * pow(w * 0.7 + w2 * 0.3, 2.0);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float att = 260.0 / max(1.0, -mv.z);
        float size = aSize * uPixelRatio * (0.75 + 0.25 * vTwinkle) * att;
        vSize = size;
        gl_PointSize = clamp(size, 1.2 * uPixelRatio, 26.0 * uPixelRatio);
        gl_Position = projectionMatrix * mv;
      }`;
    const STAR_FS = `
      varying vec3 vColor; varying float vTwinkle; varying float vSize;
      void main() {
        vec2 p = gl_PointCoord - 0.5; float d = length(p);
        if (d > 0.5) discard;
        float core = smoothstep(0.5, 0.0, d); core = core * core;
        float halo = exp(-d * d * 18.0) * 0.55;
        float cross = exp(-abs(p.x) * 40.0) * exp(-abs(p.y) * 6.0) + exp(-abs(p.y) * 40.0) * exp(-abs(p.x) * 6.0);
        cross *= smoothstep(6.0, 14.0, vSize) * 0.35;
        float a = (core + halo + cross) * vTwinkle;
        a *= smoothstep(0.5, 0.3, d); /* về 0 ở mép để không lộ ô vuông sau bloom */
        if (a < 0.002) discard;
        vec3 col = mix(vColor, vec3(1.0, 0.98, 0.9), core * 0.5);
        gl_FragColor = vec4(col * a, a);
      }`;
    const STAR_COLORS = [[1, .84, .25], [1, .9, .45], [1, .95, .7], [1, .78, .2], [1, .93, .6], [1, .72, .3]];

    function buildStars(count) {
      const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
      const size = new Float32Array(count), phase = new Float32Array(count), speed = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const b = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
        const r = 70 + Math.pow(Math.random(), .6) * 150, w = Math.sqrt(1 - b * b);
        pos[i * 3] = r * w * Math.cos(th); pos[i * 3 + 1] = r * b; pos[i * 3 + 2] = r * w * Math.sin(th);
        const c = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
        col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
        const z = Math.random();
        size[i] = z < .75 ? 1.2 + Math.random() * 1.3 : z < .94 ? 2.6 + Math.random() * 1.8 : 4.4 + Math.random() * 2.6;
        phase[i] = Math.random() * Math.PI * 2;
        speed[i] = .6 + Math.random() * 2.2;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
      g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
      g.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
      g.setAttribute("aSpeed", new THREE.BufferAttribute(speed, 1));
      starUniforms = {
        uTime: { value: 0 },
        uPixelRatio: { value: Math.min(renderer.getPixelRatio(), 2) }
      };
      const m = new THREE.ShaderMaterial({
        uniforms: starUniforms, vertexShader: STAR_VS, fragmentShader: STAR_FS,
        transparent: true, depthWrite: false, depthTest: true,
        blending: THREE.AdditiveBlending, toneMapped: false
      });
      const pts = new THREE.Points(g, m);
      pts.frustumCulled = false;
      const grp = new THREE.Group();
      grp.add(pts);
      return grp;
    }

    function setScenePaused(paused) {
      scenePaused = paused;
      if (!renderer) return;
      if (paused) renderer.setAnimationLoop(null);
      else startSceneLoop();
    }

    function startSceneLoop() {
      if (!renderer || !scene || !camera) return;
      if (!sceneClock) sceneClock = new THREE.Clock();
      sceneClock.getDelta();
      renderer.setAnimationLoop(() => {
        if (scenePaused || document.hidden) return;
        const raw = sceneClock.getDelta();
        const dt = Math.min(Number.isFinite(raw) && raw > 0 ? raw : 1 / 60, 1 / 30);
        const e = sceneClock.elapsedTime;
        cycleColor.lerpColors(COLOR_A, COLOR_B, (Math.sin(e / COLOR_PERIOD) + 1) / 2);

        for (let i = 0; i < rain.length; i++) {
          const it = rain[i];
          it.y -= it.speed * dt;
          if (it.y < Y_BOT) it.y = Y_TOP;
          const o = it.obj;
          o.position.y = it.y;
          const fade = fadeByY(it.y);
          if (it.kind === 0) {
            o.position.x = it.startX + Math.sin(e * .55 + it.phase) * it.amp;
            o.rotation.z = Math.cos(e * .55 + it.phase) * .04;
            it.mat.opacity = fade;
            it.mat.emissive.copy(cycleColor);
            it.glow.opacity = fade * .5;
            it.glow.color.copy(cycleColor);
          } else if (it.kind === 1) {
            const h = e + it.phase;
            o.position.x = it.startX + Math.sin(h * .55 + it.phase * 3.1) * .45;
            it.mat.opacity = fade;
            it.mat.color.lerpColors(COLOR_A, COLOR_B, (Math.sin(h / COLOR_PERIOD) + 1) / 2);
          } else {
            o.position.x = it.startX + Math.sin(e * .55 + it.phase) * it.amp;
            o.rotation.y += it.spin * dt;
            it.mat.opacity = fade;
          }
        }

        if (starGroup) {
          starGroup.position.copy(camera.position);
          starGroup.rotation.y += dt * .006;
          starGroup.rotation.x += dt * .0015;
          starUniforms.uTime.value = e;
        }
        controls.update();
        renderer.render(scene, camera);
      });
    }

    async function buildScene() {
      if (sceneBuilt) return;
      sceneBuilt = true;

      /* Mali không dùng trong DOM → phải ép tải trước khi vẽ canvas chữ */
      await Promise.all([
        document.fonts.ready,
        document.fonts.load("700 72px Mali").catch(() => {}),
        scenePhotosReady
      ]);
      const gallery = (scenePhotos && scenePhotos.length) ? scenePhotos
        : (photos.length ? photos : CONFIG.photos);

      renderer = new THREE.WebGLRenderer({
        antialias: false, alpha: false, powerPreference: "high-performance", stencil: false
      });
      renderer.setClearColor(0x000000, 1);
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, Q.dprMax));
      renderer.setSize(innerWidth, innerHeight, false);
      renderer.toneMapping = THREE.NoToneMapping;
      letter.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      camera = new THREE.PerspectiveCamera(100, innerWidth / innerHeight, .1, 1000);
      camera.position.set(-10, 0, 30);

      scene.add(new THREE.AmbientLight(0xffffff, 1));
      const pl = new THREE.PointLight(0xff00ff, .5, 20); pl.position.set(10, 10, 0); scene.add(pl);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableZoom = true; controls.enableRotate = true; controls.enablePan = false;
      controls.enableDamping = true; controls.dampingFactor = .06;
      controls.zoomSpeed = .35; controls.rotateSpeed = .7;
      controls.minDistance = 10; controls.maxDistance = 50;
      controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };

      starGroup = buildStars(Q.stars);
      scene.add(starGroup);

      /* ảnh — lưới 4×4, rơi + đung đưa */
      const texList = (await Promise.all(gallery.map((u) => loadRainTexture(u)))).filter(Boolean);
      if (!texList.length) {
        const t = await loadRainTexture(placeholder(0));
        if (t) texList.push(t);
      }
      const glow = getGlowTexture();
      let gi = 0;
      for (let s = 0; s < 4; s++) {
        for (let r = 0; r < 4; r++) {
          const tex = texList[gi++ % texList.length];
          const ar = tex.image.width / tex.image.height;
          const W = 10;
          const [pw, ph] = ar > 1 ? [W, W / ar] : [W * ar, W];
          /* như bản gốc: ảnh tự phát sáng hồng qua emissiveMap, bloom tạo quầng */
          const mat = new THREE.MeshStandardMaterial({
            map: tex, emissiveMap: tex, emissive: COLOR_A, emissiveIntensity: .4,
            metalness: 0, roughness: .7, transparent: true, opacity: 0,
            side: THREE.DoubleSide, toneMapped: false
          });
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mat);
          const gmat = new THREE.MeshBasicMaterial({
            map: glow, color: COLOR_A, transparent: true, opacity: 0, depthWrite: false,
            blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false
          });
          const gmesh = new THREE.Mesh(new THREE.PlaneGeometry(pw * 1.6, ph * 1.6), gmat);
          gmesh.position.z = -.05;
          mesh.add(gmesh);
          const startX = (r - 1.5) * 18, y = randY();
          mesh.position.set(startX, y, -10 + s * 10);
          scene.add(mesh);
          rain.push({
            kind: 0, obj: mesh, mat, glow: gmat, y, startX,
            speed: 4 + Math.random() * 5, amp: .8 + Math.random() * .8,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      /* chữ — lưới cols×rows, hồng */
      const wishes = (CONFIG.wishes || []).map((s) => String(s || "").trim()).filter(Boolean);
      let wi = 0;
      for (let l = 0; l < Q.rows; l++) {
        for (let c = 0; c < Q.cols; c++) {
          const text = wishes[wi++ % wishes.length];
          const h = text.length > 20 ? 6 : 3;
          const m = textMesh(text);
          const startX = (c - (Q.cols - 1) / 2) * h, y = randY();
          m.position.set(startX, y, -10 + l * h * 1.5);
          scene.add(m);
          rain.push({
            kind: 1, obj: m, mat: m.material, y, startX,
            speed: 7 + Math.random() * 2, amp: 1, phase: Math.random() * 2
          });
        }
      }

      /* tim đỏ — lưới 4×7 */
      const hGeo = heartGeometry();
      for (let s = 0; s < 4; s++) {
        for (let r = 0; r < 7; r++) {
          const mat = new THREE.MeshStandardMaterial({
            color: HEART_RED, emissive: HEART_RED, emissiveIntensity: .55,
            roughness: .55, metalness: 0, transparent: true, opacity: 0, toneMapped: false
          });
          const h = new THREE.Mesh(hGeo, mat);
          const startX = (r - 3) * 7 + (Math.random() - .5) * 3, y = randY();
          h.position.set(startX, y, -12 + s * 9 + (Math.random() - .5) * 3);
          h.scale.setScalar(.7 + Math.random() * .4);
          h.rotation.y = Math.random() * Math.PI * 2;
          scene.add(h);
          rain.push({
            kind: 2, obj: h, mat, y, startX,
            speed: 5 + Math.random() * 9, amp: .6 + Math.random() * .8,
            phase: Math.random() * Math.PI * 2, spin: .4 + Math.random() * .5
          });
        }
      }

      addEventListener("resize", () => {
        if (!renderer || !camera) return;
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, Q.dprMax));
        renderer.setSize(innerWidth, innerHeight, false);
        if (starUniforms) starUniforms.uPixelRatio.value = Math.min(renderer.getPixelRatio(), 2);
      }, { passive: true });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) setScenePaused(true);
        else if (!mail.classList.contains("is-show")) setScenePaused(false);
      });

      startSceneLoop();
      setTimeout(() => body.classList.add("is-mail-ready"), 1600);
    }

    /* ---------- phong bì + lá thư ---------- */
    const mail = $("#mail"), envScene = $("#envScene"), envelope = $("#envelope"), snap = $("#snap");
    if (CONFIG.flyHint) $("#flyHint").textContent = CONFIG.flyHint;
    const L = CONFIG.letter;
    $("#envTo").textContent = L.envTo; $("#envDate").textContent = L.envDate; $("#envSub").textContent = L.envSub;
    $("#letterTitle").textContent = L.title; $("#letterBody").textContent = L.body;
    let letterPhotoUrl = null;
    async function refreshLetterPhoto() {
      letterPhotoUrl = await loadLetterPhoto();
      if (letterPhotoUrl) $("#snapImg").src = letterPhotoUrl;
    }
    Promise.all([photosReady]).then(refreshLetterPhoto);

    let mailOpened = false;
    function showMail(on) {
      mail.classList.toggle("is-show", on);
      if (sceneBuilt) setScenePaused(on);
    }
    $("#openMail").addEventListener("click", () => {
      showMail(true);
      (mailOpened ? $("#closeMail") : envelope).focus();
    });
    $("#closeMail").addEventListener("click", () => showMail(false));
    mail.addEventListener("click", (e) => { if (e.target === mail) showMail(false); });
    function openEnvelope() {
      if (mailOpened) return;
      mailOpened = true; envScene.classList.add("is-open");
      envelope.setAttribute("aria-label", "Lá thư đã mở"); $("#envHint").textContent = "Đã mở thư.";
    }
    envelope.addEventListener("click", (e) => { if (!e.target.closest("#snap")) openEnvelope(); });
    envelope.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); } });
    snap.addEventListener("click", (e) => {
      e.stopPropagation();
      const z = snap.getAttribute("aria-pressed") !== "true"; snap.setAttribute("aria-pressed", String(z));
    });
    addEventListener("keydown", (e) => { if (e.key === "Escape") showMail(false); });

    /* ---------- nhạc (iOS: unlock lúc chạm bó hoa, tăng volume khi mở thiệp) ---------- */
    const MUSIC_VOL = .7;
    let musicOn = true, audio = null, synth = null, musicUnlocked = false, musicPlaying = false;

    function ensureAudio() {
      if (audio) return audio;
      audio = new Audio(CONFIG.music);
      audio.loop = true;
      audio.preload = "auto";
      audio.playsInline = true;
      audio.setAttribute("playsinline", "");
      audio.setAttribute("webkit-playsinline", "");
      audio.volume = 0;
      /* gắn vào DOM — iOS ổn định hơn khi element nằm trong trang */
      audio.style.cssText = "position:fixed;width:0;height:0;opacity:0;pointer-events:none";
      document.body.appendChild(audio);
      audio.addEventListener("error", () => { if (!musicPlaying) startSynth(); }, { once: true });
      return audio;
    }

    function markPlaybackSession() {
      try {
        if (typeof navigator !== "undefined" && navigator.audioSession) {
          navigator.audioSession.type = "playback";
        }
      } catch { /* ignore */ }
    }

    /** Gọi trong click/pointerdown — iPhone chỉ cho play trong gesture */
    function unlockMusic() {
      if (musicUnlocked) return;
      const a = ensureAudio();
      markPlaybackSession();
      /* volume 0 (không dùng muted) — iOS giữ quyền phát, lúc mở thiệp mới tăng tiếng */
      a.muted = false;
      a.volume = 0;
      const p = a.play();
      if (p && typeof p.then === "function") {
        p.then(() => { musicUnlocked = true; }).catch(() => { musicUnlocked = false; });
      } else {
        musicUnlocked = true;
      }
    }

    function fadeMusicIn(durationMs = 900) {
      const a = ensureAudio();
      if (!musicOn) { a.muted = true; a.volume = 0; return; }
      a.muted = false;
      markPlaybackSession();
      const ramp = () => {
        musicPlaying = true;
        musicUnlocked = true;
        const from = a.volume;
        const t0 = performance.now();
        const tick = (now) => {
          if (!musicOn) return;
          const t = Math.min(1, (now - t0) / durationMs);
          a.volume = from + (MUSIC_VOL - from) * t;
          if (t < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      };
      if (a.paused) {
        a.play().then(ramp).catch(() => startSynth());
      } else {
        ramp();
      }
    }

    function startMusic() {
      fadeMusicIn(900);
    }

    function startSynth() {
      if (synth || musicPlaying) return;
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ctx = new AC(), master = ctx.createGain(); master.gain.value = musicOn ? .05 : 0; master.connect(ctx.destination);
      const notes = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 493.88, 440, 493.88]; let step = 0;
      const play = () => {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = notes[step++ % notes.length];
        g.gain.setValueAtTime(.0001, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + .05); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + 1.1);
        o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime + 1.2);
      };
      ctx.resume?.();
      play(); synth = { master, timer: setInterval(play, 620) };
    }

    $("#music").addEventListener("click", (e) => {
      musicOn = !musicOn;
      e.currentTarget.setAttribute("aria-pressed", String(musicOn));
      $("#w1").style.display = $("#w2").style.display = musicOn ? "" : "none";
      if (audio) {
        audio.muted = !musicOn;
        if (musicOn) {
          audio.volume = MUSIC_VOL;
          if (audio.paused) audio.play().catch(() => {});
        }
      }
      if (synth) synth.master.gain.value = musicOn ? .05 : 0;
    });

    ensureAudio();
  </script>
</body>
</html>
